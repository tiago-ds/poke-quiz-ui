<div class="region-selector-hud-container flex flex-col items-center">
	<span class="hud-label-main mb-3"
		>Which regions would you like to explore?</span
	>

	<div class="region-selection-container mb-4">
		<button
			*ngFor="let region of regions"
			type="button"
			(click)="toggleRegion(region)"
			[class.selected]="selectedRegions.includes(region.name)"
			[style.background-image]="'url(' + region.badgeImage + ')'"
			[attr.aria-pressed]="selectedRegions.includes(region.name)"
			class="region-button flex items-end justify-center"
		>
			<span class="region-label">{{ region.name }}</span>
		</button>
	</div>

	<button
		type="button"
		class="submit-regions uppercase"
		(click)="confirmRegions()"
		[disabled]="selectedRegions.length === 0"
	>
		submit regions
	</button>
</div>
