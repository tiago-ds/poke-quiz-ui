<!-- Reserved so revealing the answer never shifts the buttons below. -->
<div class="feedback-slot flex shrink-0 items-center justify-center px-2">
	<p
		*ngIf="submissionMessage"
		class="feedback"
		[class.is-correct]="isCorrect"
		[class.is-wrong]="!isCorrect"
		role="status"
	>
		<span class="feedback-icon" aria-hidden="true">{{
			isCorrect ? "✔" : "✕"
		}}</span>
		<span>{{ submissionMessage }}</span>
	</p>
</div>

<div class="options grid shrink-0 grid-cols-2 gap-2 sm:gap-3">
	<quiz-option
		*ngFor="let type of options"
		[type]="type"
		[isChecked]="selectedTypes.includes(type)"
		[state]="optionState(type)"
		[disabled]="isLocked"
		(selectionChange)="onTypeSelectionChange($event)"
	/>
</div>

<div class="primary-action flex shrink-0 flex-col items-center gap-2">
	<button
		type="button"
		class="submit-button"
		(click)="onPrimaryAction()"
		[disabled]="isPrimaryDisabled"
	>
		{{ primaryLabel }}
	</button>

	<!-- Counts down to the automatic advance; the button skips it. -->
	<div
		*ngIf="phase === 'revealed' && !isLoading"
		class="auto-advance"
		aria-hidden="true"
	>
		<span
			class="auto-advance-bar"
			[style.animation-duration.ms]="autoAdvanceMs"
		></span>
	</div>
</div>
