<label
	class="quiz-option flex h-full w-full cursor-pointer items-center gap-2 sm:gap-3"
	[ngClass]="['type-' + type, 'is-' + state]"
	[class.is-disabled]="disabled"
>
	<input
		type="checkbox"
		[name]="'pokemon-type-' + type"
		[value]="type"
		[checked]="isChecked"
		[disabled]="disabled"
		(change)="onCheckboxChange($event)"
	/>
	<span class="quiz-option-label">{{ type }}</span>
	<span class="quiz-option-mark" aria-hidden="true"></span>
</label>
