<main
	class="flex h-dvh w-full flex-col items-center gap-4 overflow-hidden p-3 md:flex-row md:items-stretch md:justify-center md:gap-8 md:p-6"
>
	<aside
		class="flex max-h-[56%] w-full min-h-0 shrink flex-col items-center gap-3 overflow-y-auto md:max-h-none md:w-auto md:max-w-sm md:shrink-0 md:justify-center md:gap-4"
	>
		<app-score-counter
			[currentScore]="totalScore"
			[currentStreak]="currentStreak"
			class="w-full max-w-sm"
		/>
		<app-region-selector
			(regionsConfirmed)="onSelectedRegionsChange($event)"
			class="w-full max-w-sm"
		/>
	</aside>

	<app-game-boy
		(quizResult)="onQuizResult($event)"
		[selectedRegions]="selectedRegions"
		class="flex min-h-0 flex-1 items-center justify-center"
	/>
</main>
